<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="">
    <title>Fotogram</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="fonts.css">
    <script src="script.js"></script>
</head>
<body onload="init()">
    <header>
        <section class="header-wrapper">
            <img src="assets/icon/fotogram-icon.png" alt="Fotogram icon">
            <img src="assets/icon/Fotogram.png" alt="Fotogram">
        </section>
    </header>
    <main>
        <h1>Your personal photo album</h1>

        <section class="gallery" id="gallery"></section>
        
        <dialog class="open_dialog" id="open_dialog">
            <div id="dialog_header">
                <h2 id="image_title"></h2>
                <button id="close_dialog">x</button>
            </div>
            <img id="image-center" src="" alt="Mittlere Bild">
            <div id="image-navigation">
                <button id="previous-image"><img src="./assets/icon/Button-left.png" alt="Pgeil links"></button>
                <p id="counter"></p>
                <button id="next-image"><img src="assets/icon/Button Right.svg" alt="Pfeil rechts"></button>
            </div>

        </dialog>


    </main>
    <footer>
        <img src="assets/icon/Logo DA.png" alt="DA-icon">
        <p>© 2023 Developer Akademie GmbH</p>
    </footer>
    
</body>
</html>
